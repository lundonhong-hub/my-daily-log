# ⚠️ 이 파일은 레포에서 아래 경로에 두어야 합니다 (GitHub Actions 규칙):
#     .github/workflows/dashboard.yml

name: 대시보드 생성 (스케줄)

on:
  schedule:
    # KST 기준 실행 시간 (UTC 변환):
    - cron: '0 22 * * *'   # KST 07:00 (전날 UTC 22:00)
    - cron: '40 2 * * *'   # KST 11:40 (당일 UTC 02:40)
    - cron: '0 10 * * *'   # KST 19:00 (당일 UTC 10:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install anthropic yfinance requests jinja2 holidays

      - name: 공휴일 및 실행 시간 검증
        id: check_schedule
        run: |
          python -c "
          import datetime, zoneinfo, holidays, sys

          # KST 기준 현재 시간 가져오기
          kst = zoneinfo.ZoneInfo('Asia/Seoul')
          now = datetime.datetime.now(kst)

          kr_holidays = holidays.KR(years=now.year)
          is_holiday_or_weekend = (now.date() in kr_holidays) or (now.weekday() >= 5) # 토(5), 일(6)

          print(f'현재 KST 시간: {now.strftime(\"%Y-%m-%d %H:%M\")}')
          print(f'공휴일/주말 여부: {is_holiday_or_weekend}')

          # 공휴일이나 주말일 경우, 아침 7시 실행(6:00~7:59 사이)이 아니면 스킵
          if is_holiday_or_weekend and not (6 <= now.hour < 8):
              print('>> 공휴일/주말 점심 및 저녁 실행은 스킵합니다.')
              sys.exit(78) # 78 코드 반환시 정상 종료 및 이후 스텝 스킵
          "

      - name: 대시보드 생성 + 검증
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FILENAME: index.html
        run: python generate_dashboard.py

      - name: GitHub에 저장
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "dashboard $(date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git push

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 대시보드 생성 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
