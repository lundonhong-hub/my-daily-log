# ⚠️ 이 파일은 레포에서 아래 경로에 두어야 합니다 (GitHub Actions 규칙):
#     .github/workflows/dashboard.yml

name: 대시보드 생성 (스케줄)

on:
  schedule:
    # KST 기준 실행 시간 (UTC 변환):
    - cron: '0 22 * * *'   # KST 07:00 (전날 UTC 22:00)
    - cron: '40 2 * * *'   # KST 11:40 (당일 UTC 02:40)
    - cron: '0 10 * * *'   # KST 19:00 (당일 UTC 10:00)
  workflow_dispatch:        # 버튼 눌러 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install anthropic yfinance requests jinja2 holidays

      - name: 공휴일 및 실행 시간 검증
        id: check_schedule
        run: |
          python -c "
          import datetime, zoneinfo, holidays, os

          # KST 기준 현재 시간 가져오기
          kst = zoneinfo.ZoneInfo('Asia/Seoul')
          now = datetime.datetime.now(kst)

          # 이벤트 타입 확인 ('workflow_dispatch'는 수동 실행)
          event_name = '${{ github.event_name }}'

          kr_holidays = holidays.KR(years=now.year)
          is_holiday_or_weekend = (now.date() in kr_holidays) or (now.weekday() >= 5)

          print(f'실행 유형: {event_name}')
          print(f'현재 KST 시간: {now.strftime(\"%Y-%m-%d %H:%M\")}')
          print(f'공휴일/주말 여부: {is_holiday_or_weekend}')

          skip = 'false'

          # 수동 실행이 아닌 '스케줄' 실행일 때만 조건 검사
          if event_name == 'schedule':
              if is_holiday_or_weekend and not (6 <= now.hour < 8):
                  print('>> [스케줄 실행] 공휴일/주말 점심 및 저녁 실행은 스킵합니다.')
                  skip = 'true'

          # GitHub Actions 변수로 전달 (정상 종료 0 사용)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'skip={skip}\n')
          "

      - name: 대시보드 생성 + 검증
        if: steps.check_schedule.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FILENAME: index.html
        run: python generate_dashboard.py

      - name: GitHub에 저장
        if: steps.check_schedule.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "dashboard $(date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git push

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 대시보드 생성 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
