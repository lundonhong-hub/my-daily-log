# ⚠️ 이 파일은 레포에서 아래 경로에 두어야 합니다 (GitHub Actions 규칙):
#     .github/workflows/dashboard.yml

name: 대시보드 생성 (스케줄)

on:
  schedule:
    # KST 기준 실행 시간 (UTC 변환):
    - cron: '0 22 * * *'   # KST 07:00 (전날 UTC 22:00)
    - cron: '40 2 * * *'   # KST 11:40 (당일 UTC 02:40)
    - cron: '0 10 * * *'   # KST 19:00 (당일 UTC 10:00)
  workflow_dispatch:        # 수동 실행 버튼

# 저장소에 git push 할 수 있는 쓰기 권한 부여 (필수)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pandas 는 data_collector._fetch_hist 가 직접 import 한다.
      # yfinance 의존성으로 딸려오긴 하지만 명시하지 않으면 나중에 깨진다.
      - name: 패키지 설치
        run: pip install anthropic yfinance requests jinja2 pandas holidays

      - name: 공휴일 및 실행 시간 검증
        id: check_schedule
        run: |
          python -c "
          import datetime, zoneinfo, holidays, os
          # KST 기준 현재 시간 가져오기
          kst = zoneinfo.ZoneInfo('Asia/Seoul')
          now = datetime.datetime.now(kst)
          # 이벤트 타입 확인 ('workflow_dispatch'는 수동 실행)
          event_name = '${{ github.event_name }}'
          # 연말/연초 대비 올해와 내년 공휴일 함께 로드
          kr_holidays = holidays.KR(years=[now.year, now.year + 1])
          is_saturday = (now.weekday() == 5)
          is_holiday_or_sunday = (now.date() in kr_holidays) or (now.weekday() == 6)
          print(f'실행 유형: {event_name}')
          print(f'현재 KST 시간: {now.strftime(\"%Y-%m-%d %H:%M\")} ({\"월화수목금토일\"[now.weekday()]}요일)')
          print(f'토요일 여부: {is_saturday} / 일요일·공휴일 여부: {is_holiday_or_sunday}')
          skip = 'false'
          # 수동 실행이 아닌 '스케줄' 실행일 때만 조건 검사
          if event_name == 'schedule':
              # 토요일: 시각과 무관하게 항상 건너뛴다.
              #   금요일 미국장은 한국시간 새벽 5시(서머타임 기준)에 마감되므로
              #   '금요일 저녁에 다 끝난다'는 전제는 틀렸고, 토요일 07:00 실행이
              #   금요일 미국 마감을 가장 먼저 반영하는 시점이다. 그럼에도 불구하고
              #   주말엔 거래가 없어 토요일판과 일요일판의 시황 수치는 동일하므로,
              #   중복을 줄이는 대신 확인 시점이 최대 하루 늦어지는 것을 감수하고
              #   일요일 07:00 한 번으로 통합한다. (사용자 결정, 2026-07-25)
              if is_saturday:
                  print('>> [스케줄 실행] 토요일은 항상 건너뜁니다.')
                  skip = 'true'
              # 일요일·공휴일: 아침 슬롯(KST 07:00 예정)만 발행한다.
              #   hour == 7 등호 비교는 위험하다 — GitHub Actions 스케줄은 부하 시
              #   수십 분에서 한 시간 넘게 밀리고, 그때 일요일판이 통째로 스킵된다.
              #   05~10시 범위로 판정해 지연 3시간까지 견디게 한다.
              elif is_holiday_or_sunday and not (5 <= now.hour <= 10):
                  print('>> [스케줄 실행] 공휴일/일요일 점심 및 저녁 실행은 스킵합니다.')
                  skip = 'true'
          # GitHub Actions 변수로 전달
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'skip={skip}\n')
          "

      - name: 대시보드 생성 + 검증
        if: steps.check_schedule.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FILENAME: index.html
        run: python generate_dashboard.py

      - name: GitHub에 저장
        if: steps.check_schedule.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "dashboard $(date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git push

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 대시보드 생성 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
